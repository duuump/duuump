<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duuump — image bookmarking</title>
  <meta name="description" content="Duuump — kolekcja inspiracji wizualnych." />
  <link rel="icon" type="image/svg+xml" href="logo.svg" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="frame">

    <header class="frame-header">
      <a href="/" aria-label="Duuump">
        <img src="logo.svg" alt="Duuump" class="logo" />
      </a>
      <span class="subtitle">personal image bookmarking</span>
    </header>

    <nav class="frame-categories" id="categoryBar" aria-label="Kategorie">
    </nav>

    <main class="frame-body" id="frameBody">
      <ul id="grid" class="grid" aria-label="Inspiracje"></ul>
      <div id="collage" class="collage-canvas" hidden></div>
      <p id="empty" class="empty" hidden>Brak inspiracji.</p>
    </main>

    <footer class="frame-footer">
      <span class="footer-left">
        <a href="/manifest.html" class="footer-link">manifest</a>
      </span>
      <span class="view-toggle" id="viewToggle">
        <button type="button" class="view-btn" data-mode="collage" title="Kolaż">collage</button>
        <button type="button" class="view-btn" data-mode="single" title="Jeden duży">single</button>
        <button type="button" class="view-btn" data-mode="large" title="Duże miniatury">large</button>
        <button type="button" class="view-btn" data-mode="small" title="Małe ikony">thumbnails</button>
        <button type="button" class="view-btn theme-btn" id="themeToggle" title="Dark / light mode">light</button>
      </span>
    </footer>

  </div>

  <!-- Lightbox -->
  <div id="modal" class="modal" hidden>
    <button class="modal-close" id="modalClose" aria-label="Zamknij">[x]</button>
    <figure class="modal-figure">
      <img id="modalImg" alt="" />
      <figcaption>
        <p id="modalCaption" class="modal-caption"></p>
        <p id="modalAuthor" class="modal-author"></p>
      </figcaption>
    </figure>
  </div>

  <script src="app.js"></script>
</body>
</html>
