<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duuump — admin</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="frame">
    <header class="frame-header">
      <a href="/" aria-label="Duuump - strona glowna">
        <img src="/logo.svg" alt="Duuump" class="logo" />
      </a>
      <span class="title-text">— admin</span>
    </header>

    <main class="frame-body">
      <form id="form" novalidate>
        <!-- Drop zone -->
        <label for="file" id="drop" class="drop">
          <div class="drop-content" id="dropContent">
            <p class="drop-icon">[ + ]</p>
            <p class="drop-text">Przeciagnij obrazek tutaj lub kliknij</p>
            <p class="drop-hint">JPG, PNG, GIF, WebP — max 25 MB &middot; mozesz tez wkleic Cmd+V</p>
          </div>
          <div class="preview-content" id="previewContent" hidden>
            <img id="preview" alt="Podglad" />
            <p class="preview-name" id="previewName"></p>
            <button type="button" id="removeFile" class="link-btn">[ zmien plik ]</button>
          </div>
        </label>
        <input type="file" id="file" accept="image/*" hidden />

        <!-- Pola -->
        <div class="field">
          <label for="caption">Podpis</label>
          <input type="text" id="caption" name="caption" placeholder="np. Burberry Winter 2025" />
        </div>

        <div class="field">
          <label for="author">Autor</label>
          <input type="text" id="author" name="author" placeholder="np. Blinkink" />
        </div>

        <div class="field">
          <label for="authorUrl">Link</label>
          <input type="url" id="authorUrl" name="authorUrl" placeholder="https://instagram.com/..." />
        </div>

        <div class="submit-row">
          <button type="submit" id="submit" class="submit-btn" disabled>
            <span class="submit-label">Dodaj do Duuump</span>
            <span class="submit-spinner" hidden>Wysylam...</span>
          </button>
        </div>

        <div id="status" class="status" hidden></div>
      </form>
    </main>

    <footer class="frame-footer">
      <span>localhost:4000 &middot; lokalny panel</span>
      <span><a href="https://duuump.github.io/duuump/" target="_blank" rel="noopener">duuump.github.io/duuump</a></span>
    </footer>
  </div>

  <script src="admin.js"></script>
</body>
</html>
