<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duuump — admin</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div class="frame">
    <header class="frame-header">
      <a href="/" aria-label="Duuump - strona glowna">
        <img src="/logo.svg" alt="Duuump" class="logo" />
      </a>
      <span class="title-text">— admin</span>
    </header>

    <main class="frame-body">
      <!-- ===== Sekcja: dodawanie ===== -->
      <section class="panel-section">
        <h2 class="section-heading">Dodaj inspiracje</h2>

        <form id="form" novalidate>
          <label for="file" id="drop" class="drop">
            <div class="drop-content" id="dropContent">
              <p class="drop-icon">[ + ]</p>
              <p class="drop-text">Przeciagnij obrazek tutaj lub kliknij</p>
              <p class="drop-hint">JPG, PNG, GIF, WebP — max 25 MB &middot; mozesz tez wkleic Cmd+V</p>
            </div>
            <div class="preview-content" id="previewContent" hidden>
              <img id="preview" alt="Podglad" />
              <p class="preview-name" id="previewName"></p>
              <button type="button" id="removeFile" class="link-btn">[ zmien plik ]</button>
            </div>
          </label>
          <input type="file" id="file" accept="image/*" hidden />

          <div class="url-row">
            <span class="url-label">lub</span>
            <input type="url" id="urlInput" class="url-input" placeholder="wklej URL obrazka (https://...jpg)" />
            <button type="button" id="loadUrlBtn" class="url-btn">[ pobierz ]</button>
          </div>
          <div id="urlStatus" class="url-status" hidden></div>

          <div class="field">
            <label for="caption">Podpis</label>
            <input type="text" id="caption" name="caption" placeholder="np. Burberry Winter 2025" />
          </div>

          <div class="field">
            <label for="author">Autor</label>
            <input type="text" id="author" name="author" placeholder="np. Blinkink" />
          </div>

          <div class="field">
            <label for="authorUrl">Link</label>
            <input type="url" id="authorUrl" name="authorUrl" placeholder="https://instagram.com/..." />
          </div>

          <div class="field">
            <label for="category">Kategoria</label>
            <select id="category" name="category">
              <option value="other">other</option>
              <option value="logo">logo</option>
              <option value="typography">typography</option>
              <option value="photography">photography</option>
              <option value="illustration">illustration</option>
              <option value="object">object</option>
              <option value="music">music</option>
            </select>
          </div>

          <div class="submit-row">
            <button type="submit" id="submit" class="submit-btn" disabled>
              <span class="submit-label">Dodaj do Duuump</span>
              <span class="submit-spinner" hidden>Wysylam...</span>
            </button>
          </div>

          <div id="status" class="status" hidden></div>
        </form>
      </section>

      <!-- ===== Sekcja: istniejace ===== -->
      <section class="panel-section">
        <h2 class="section-heading">
          Istniejace inspiracje
          <span class="muted" id="listCount"></span>
        </h2>

        <div id="listStatus" class="status" hidden></div>

        <p class="list-hint muted">
          Przeciagnij wpis za <span class="grip-inline">[::]</span> zeby zmienic kolejnosc &middot; po pusczeniu zapisuje sie automatycznie
        </p>

        <ul id="list" class="list" aria-label="Lista wpisow"></ul>
      </section>
    </main>

    <footer class="frame-footer">
      <span>localhost:4000 &middot; lokalny panel</span>
      <span><a href="https://duuump.github.io/duuump/" target="_blank" rel="noopener">duuump.github.io/duuump</a></span>
    </footer>
  </div>

  <!-- Template: pojedynczy wpis na liscie -->
  <template id="itemTemplate">
    <li class="item" draggable="true">
      <span class="item-grip" title="Przeciagnij zeby zmienic kolejnosc">[::]</span>
      <img class="item-thumb" alt="" />
      <div class="item-meta">
        <p class="item-caption muted-when-empty"></p>
        <p class="item-author muted"></p>
      </div>
      <div class="item-actions">
        <button type="button" class="link-btn item-edit">[ edytuj ]</button>
        <button type="button" class="link-btn item-delete">[ usun ]</button>
      </div>
    </li>
  </template>

  <!-- Template: tryb edycji -->
  <template id="editTemplate">
    <form class="item-edit-form">
      <span class="item-grip" aria-hidden="true">&nbsp;</span>
      <img class="item-thumb" alt="" />
      <div class="item-meta">
        <div class="field-mini">
          <label>Podpis</label>
          <input type="text" name="caption" />
        </div>
        <div class="field-mini">
          <label>Autor</label>
          <input type="text" name="author" />
        </div>
        <div class="field-mini">
          <label>Link</label>
          <input type="url" name="authorUrl" />
        </div>
        <div class="field-mini">
          <label>Kategoria</label>
          <select name="category">
            <option value="other">other</option>
            <option value="logo">logo</option>
            <option value="typography">typography</option>
            <option value="photography">photography</option>
            <option value="illustration">illustration</option>
            <option value="object">object</option>
            <option value="music">music</option>
          </select>
        </div>
      </div>
      <div class="item-actions">
        <button type="submit" class="link-btn">[ zapisz ]</button>
        <button type="button" class="link-btn item-cancel">[ anuluj ]</button>
      </div>
    </form>
  </template>

  <script src="admin.js"></script>
</body>
</html>
