<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Duuump — admin</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <header>
    <h1>Duuump <span class="muted">— admin</span></h1>
    <p class="muted">Dodaj nową inspirację</p>
  </header>

  <main>
    <form id="form" novalidate>
      <!-- Drop zone -->
      <label for="file" id="drop" class="drop">
        <div class="drop-content" id="dropContent">
          <p class="drop-icon">↓</p>
          <p class="drop-text">Przeciągnij obrazek tutaj<br />lub kliknij, aby wybrać</p>
          <p class="drop-hint">JPG, PNG, GIF, WebP — max 25 MB</p>
        </div>
        <div class="preview-content" id="previewContent" hidden>
          <img id="preview" alt="Podgląd" />
          <p class="preview-name" id="previewName"></p>
          <button type="button" id="removeFile" class="link-btn">Zmień plik</button>
        </div>
      </label>
      <input type="file" id="file" accept="image/*" hidden />

      <!-- Pola tekstowe -->
      <div class="field">
        <label for="caption">Podpis</label>
        <input type="text" id="caption" name="caption" placeholder="np. Burberry Winter 2025" />
      </div>

      <div class="field">
        <label for="author">Autor</label>
        <input type="text" id="author" name="author" placeholder="np. Blinkink" />
      </div>

      <div class="field">
        <label for="authorUrl">Link autora</label>
        <input type="url" id="authorUrl" name="authorUrl" placeholder="https://instagram.com/..." />
      </div>

      <!-- Submit -->
      <button type="submit" id="submit" class="submit-btn" disabled>
        <span class="submit-label">Dodaj do Duuump</span>
        <span class="submit-spinner" hidden>Wysyłam...</span>
      </button>

      <!-- Status -->
      <div id="status" class="status" hidden></div>
    </form>
  </main>

  <footer>
    <p class="muted">
      Działa lokalnie • <a href="https://duuump.github.io/duuump/" target="_blank">duuump.github.io/duuump</a>
    </p>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
